<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .message-box {
            text-align: center;
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 20px;
            border: 2px solid #ff0055;
            box-shadow: 0 0 20px #ff0055;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="message-box">
        ADAM HOP HOP
    </div>

</body>
</html>
